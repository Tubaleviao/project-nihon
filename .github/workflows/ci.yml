name: CI

# A push or PR that touches only hand-written docs skips CI. Docs that CI reads stay out of this
# list: bible/ and wiki/ (generated, checked for fabric drift), ROADMAP.md and
# docs/roadmap-history/ (check_roadmap.js) and docs/perf/ (stress + playtest baselines).
# A change to only the roadmap (plus docs from this list) runs a light CI: the `changes` job
# skips everything but `fabric` (which runs check_roadmap.js) and the workflow lint.
on:
  push:
    branches: [main, master]
    paths-ignore: &docs-only
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - characters.md
      - assets/README.md
      - native/README.md
      - docs/DEVELOPMENT.md
      - docs/media/**
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:
    inputs:
      stress_max:
        description: "Crowd stress run: the largest crowd to try (16, 32, 64, 128 or 200)"
        default: "64"
      stress_profiles:
        description: "Crowd stress run: link profiles, space-separated (lan, wan_br, wan_bad)"
        default: "lan"

# A new push to a pull request cancels that PR's older run. Pushes and manual runs get a group
# of their own (the run id), so they never cancel or queue behind each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    # `light` is true when every changed path is a roadmap file or a docs-only path (the list above).
    # The roadmap still needs `check_roadmap.js` (in `fabric`, which always runs), but not the suite,
    # boots, harness, playtest, stress or exports, so those skip. Anything unclear (a manual run, a
    # new branch, a failed diff) counts as not light and runs everything.
    runs-on: ubuntu-latest
    outputs:
      light: ${{ steps.classify.outputs.light }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          light=false
          if [ "$EVENT" = pull_request ]; then
            # The checkout is the PR's merge commit: its first parent is the base.
            files=$(git diff --name-only HEAD^1 HEAD) || files=""
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            files=$(git diff --name-only "$BEFORE" HEAD) || files=""
          else
            files=""
          fi
          if [ -n "$files" ]; then
            light=true
            while IFS= read -r f; do
              case "$f" in
                ROADMAP.md|docs/roadmap-history/*|README.md|AGENTS.md|CLAUDE.md|characters.md) ;;
                assets/README.md|native/README.md|docs/DEVELOPMENT.md|docs/media/*) ;;
                *) light=false; echo "runs full CI: $f"; break ;;
              esac
            done <<< "$files"
          fi
          echo "light=$light" | tee -a "$GITHUB_OUTPUT"

  godot-tests:
    name: Godot headless test suite
    # A manual dispatch is for the crowd stress run only.
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The private `assets-prod` submodule is intentionally NOT checked out:
        # the public repo runs clean on the committed placeholders, and the
        # production art lives in a separately-built, gitignored .pck.

      - name: Download Godot 4.7
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Placeholder loop clips close their cycle
        run: python3 tools/gen_placeholder_glb.py --check

      - name: Run headless test suite
        run: |
          # --quit is mandatory: without it the headless main loop never exits.
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --quit -- --run-tests --expect-fallback \
            2>&1 | tee /tmp/godot-tests.log
          if ! grep -q "All tests passed" /tmp/godot-tests.log; then
            echo "::error::test suite did not report 'All tests passed'"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-tests.log; then
            echo "::error::script/parse/compile errors present"
            exit 1
          fi
          if grep -q "✗" /tmp/godot-tests.log; then
            echo "::error::one or more tests failed"
            exit 1
          fi

  native-linux:
    name: Native builder (linux)
    # Its own job, not a leg of the matrix below: the jobs that run the Linux binary (native-suite,
    # playtest, export-native) need only this one, so they no longer wait for the macOS build.
    # A manual dispatch is for the crowd stress run only.
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-latest
    env:
      # godot-cpp's SConstruct reads SCONS_CACHE: compiled objects are reused across runs, so only
      # what changed is rebuilt (the godot-cpp bindings were most of the build time).
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: native/godot-cpp
          key: godot-cpp-godot-4.5-stable-ubuntu-latest

      - name: Cache the SCons build
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-godot-4.5-stable-ubuntu-latest-${{ hashFiles('native/src/**', 'native/SConstruct') }}
          restore-keys: scons-godot-4.5-stable-ubuntu-latest-

      - name: Fetch godot-cpp
        shell: bash
        run: tools/fetch_godot_cpp.sh

      - name: Install SCons
        run: python -m pip install scons

      - name: Build the extension
        shell: bash
        working-directory: native
        run: |
          # Both targets: the editor binary loads the debug library, the exports the release one.
          scons platform=linux arch=x86_64 target=template_debug -j4
          scons platform=linux arch=x86_64 target=template_release -j4
          ls bin

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: native/bin/
          if-no-files-found: error

  native:
    name: Native builder (${{ matrix.name }})
    # A manual dispatch is for the crowd stress run only.
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.light != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, scons: "platform=windows arch=x86_64" }
          - { name: macos, os: macos-latest, scons: "platform=macos arch=universal" }
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: native/godot-cpp
          key: godot-cpp-godot-4.5-stable-${{ matrix.os }}

      - name: Cache the SCons build
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-godot-4.5-stable-${{ matrix.os }}-${{ hashFiles('native/src/**', 'native/SConstruct') }}
          restore-keys: scons-godot-4.5-stable-${{ matrix.os }}-

      - name: Fetch godot-cpp
        shell: bash
        run: tools/fetch_godot_cpp.sh

      - name: Install SCons
        run: python -m pip install scons

      - name: Build the extension
        shell: bash
        working-directory: native
        run: |
          # A pull request compiles the debug target to prove the platform builds (its build job exports
          # debug), and main builds both.
          scons ${{ matrix.scons }} target=template_debug -j4
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            scons ${{ matrix.scons }} target=template_release -j4
          fi
          ls bin

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: native/bin/
          if-no-files-found: error

  native-suite:
    name: Godot suite with the native builder
    needs: native-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: native/bin

      - name: Download Godot 4.7
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Run the test suite with the binary present
        run: |
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --quit -- --run-tests --expect-native \
            2>&1 | tee /tmp/godot-native.log
          if ! grep -q "All tests passed" /tmp/godot-native.log; then
            echo "::error::Test suite did not report 'All tests passed' with the native builder"
            exit 1
          fi
          if ! grep -q "\[Native\] chunk builder: native" /tmp/godot-native.log; then
            echo "::error::The loader did not report the native builder"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-native.log; then
            echo "::error::Script errors in the native-builder run"
            exit 1
          fi
          if grep -q "✗" /tmp/godot-native.log; then
            echo "::error::Failing assertions in the native-builder run"
            exit 1
          fi

  workflows:
    name: Lint workflows
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  server-boot:
    name: Dedicated server boots clean
    # A manual dispatch is for the crowd stress run only.
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Same submodule note as godot-tests: the public repo runs on the
        # committed placeholders.

      - name: Download Godot 4.7
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Boot the dedicated server headless
        run: |
          # `--server` is a USER arg: it must follow the `--` separator.
          # OS.get_cmdline_user_args() returns only what comes after it, so
          # passing `--server` among the engine args would silently boot a
          # listen host instead and the job would prove nothing.
          # `--quit` is mandatory: without it the headless main loop never exits.
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --quit -- --server \
            2>&1 | tee /tmp/godot-server.log
          # Positive assertion: the server path must report it actually came up,
          # not merely fail to crash.
          if ! grep -q "\[Server\] listening on port" /tmp/godot-server.log; then
            echo "::error::server did not report a listening line"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-server.log; then
            echo "::error::script/parse/compile errors present in the server boot log"
            exit 1
          fi

  host-boot:
    name: Listen host reaches the world (first ring placed)
    # A manual dispatch is for the crowd stress run only.
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-latest
    # Phase 42 review pass 4 — a hard cap on this job. The boot below waits on
    # WorkerThreadPool tasks, and `--quit-after 100000` (its outer net) is FRAMES: a boot
    # that never reaches its tail would burn runner time up to GitHub's 360-minute default
    # before anyone learned the ring never opened. The measured boot is ~50 s, so ten
    # minutes is a wide margin that still fails fast.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        # Same submodule note as godot-tests: the public repo runs on the
        # committed placeholders.

      - name: Download Godot 4.7
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Boot the LISTEN HOST and assert its world boot completed
        run: |
          # Phase 42 moved the host tail (player spawn, boot demos, slot save) onto
          # `_process`, behind the first-ring gate, so it no longer runs inside
          # `_ready()`. `--quit` runs exactly ONE frame and therefore SKIPPED that
          # whole tail — which is why nothing here asserted the host boot any more.
          # `--quit-after N` runs real frames and reaches it.
          #
          # Phase 42 review #2 — but N counts FRAMES while the boot waits on WORKER
          # time, so a fast headless frame loop could burn the budget before the ring's
          # tasks land and this job would fail for a boot that was working. The boot
          # now ends ITSELF the moment its tail has run (`--quit-after-boot`), and
          # `--quit-after` is demoted to an outer net that only catches a boot which
          # never gets there — hence the very large count.
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --quit-after 100000 -- --quit-after-boot \
            2>&1 | tee /tmp/godot-host.log
          # Positive assertion: the tail RAN — the first ring was built and the player
          # was placed. That is the claim `--quit` used to cover by accident.
          if ! grep -q "\[World\] first ring built" /tmp/godot-host.log; then
            echo "::error::the host boot never reached its tail (first ring placed)"
            exit 1
          fi
          # And it must not have got there by TIMING OUT: the timeout warning names an
          # incomplete ring, which is a slow boot that says so, not a working one.
          if grep -q "first ring still incomplete" /tmp/godot-host.log; then
            echo "::error::the host boot only completed through the first-ring timeout"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-host.log; then
            echo "::error::script/parse/compile errors present in the host boot log"
            exit 1
          fi

  fabric:
    name: Fabric validation + drift check
    # A manual dispatch is for the crowd stress run only.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate fabric schema
        run: npm run validate

      - name: Check generated files for fabric drift
        run: npm run check-drift

      - name: Check the biome adjacency validation rejects bad tables
        run: node tools/check_biome_adjacency.js

      - name: Check the weather table validation rejects bad tables
        run: node tools/check_weather.js

      - name: Check the settlement validation rejects bad tables
        run: node tools/check_settlement.js

      - name: Check the granular-material validation rejects bad fabric
        run: node tools/check_granular.js

      - name: Check the creature body validation rejects bad fabric
        run: node tools/check_bodies.js

      - name: Check the item-shape validation rejects bad shapes
        run: node tools/check_item_shapes.js

      - name: Check the item art is current and the generator is deterministic
        run: |
          python3 tools/gen_item_assets.py --check
          python3 tools/gen_item_assets.py --out /tmp/items-a
          python3 tools/gen_item_assets.py --out /tmp/items-b
          diff -r /tmp/items-a /tmp/items-b

      - name: Check the holdable icons are current and the generator is deterministic
        run: |
          python3 tools/gen_holdable_icons.py --check
          python3 tools/gen_holdable_icons.py --out /tmp/holdables-a
          python3 tools/gen_holdable_icons.py --out /tmp/holdables-b
          diff -r /tmp/holdables-a /tmp/holdables-b

      - name: Check the UI icons are current and the generator is deterministic
        run: |
          python3 tools/gen_ui_icons.py --check
          python3 tools/gen_ui_icons.py --out /tmp/ui-icons-a
          python3 tools/gen_ui_icons.py --out /tmp/ui-icons-b
          diff -r /tmp/ui-icons-a /tmp/ui-icons-b

      - name: Check the UI skin placeholders are current and the generator is deterministic
        run: |
          python3 tools/gen_ui_skin.py --check
          python3 tools/gen_ui_skin.py --out /tmp/ui-skin-a
          python3 tools/gen_ui_skin.py --out /tmp/ui-skin-b
          diff -r /tmp/ui-skin-a /tmp/ui-skin-b

      - name: Check the status-effect table validation rejects bad tables
        run: node tools/check_combat.js

      - name: Check the gesture table validation rejects bad tables
        run: node tools/check_gestures.js

      - name: Check the harvest validation rejects bad tables
        run: node tools/check_harvest.js

      - name: Check the attribute validation rejects bad tables
        run: node tools/check_attributes.js

      - name: Check the character-creation validation rejects bad tables
        run: node tools/check_creation.js

      - name: Check the tutorial and bed validation rejects bad tables
        run: node tools/check_tutorial.js

      - name: Check the roadmap index matches the phase specs
        run: node tools/check_roadmap.js

  net-harness:
    name: Two-client network harness (loopback ENet)
    # A manual dispatch is for the crowd stress run only.
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Same submodule note as godot-tests: the public repo runs on the
        # committed placeholders.

      - name: Download Godot 4.7
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Run the two-client harness
        env:
          # The driver takes the binary from $GODOT (it is not on PATH) and writes both
          # processes' logs under $NET_HARNESS_LOGDIR so the artifact step below can
          # collect them when a step fails.
          GODOT: /tmp/godot/Godot_v4.7-stable_linux.x86_64
          NET_HARNESS_LOGDIR: ${{ runner.temp }}/net-harness
        run: tools/net_harness.sh

      - name: Run the two-client harness under the wan_bad profile
        # Phase 135 — 200 ms ± 60 ms, 5% loss, 256 kbit/s on both processes' outbound packets; the log
        # records the profile in use and the driver fails if either side ran another.
        env:
          GODOT: /tmp/godot/Godot_v4.7-stable_linux.x86_64
          NET_HARNESS_LOGDIR: ${{ runner.temp }}/net-harness-wan-bad
          NET_PROFILE: wan_bad
        run: tools/net_harness.sh

      - name: Upload harness logs
        # Diagnostics only: the driver has already failed the job by this point, and the
        # two processes' logs are what says WHICH step broke.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: net-harness-logs
          path: |
            ${{ runner.temp }}/net-harness
            ${{ runner.temp }}/net-harness-wan-bad
          if-no-files-found: ignore

  stress:
    name: Crowd stress run and bottleneck report
    # Phase 162 — main pushes and manual runs. A pull request runs it only when it touches the host's hot
    # path or the stress tooling (the `scope` step), so the baseline gate fails the PR, not main after the merge.
    # A manual run can pass a bigger ceiling and other link profiles.
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.light != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        # Same submodule note as godot-tests: the public repo runs on the committed placeholders.
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}   # a bare 0 is falsy and would yield 1

      - name: Does this pull request touch the host's hot path?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hot='^(src/(networking|terrain|persistence|world|core)/|src/tests/stress|tools/stress|project\.godot$|\.github/workflows/ci\.yml$)'
          # A diff that cannot be taken (no base commit) runs the stress job rather than skip it.
          if ! changed=$(git diff --name-only "$BASE_SHA" HEAD) || grep -qE "$hot" <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No host hot-path or stress tooling change; the stress run is skipped on this pull request." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download Godot 4.7
        if: steps.scope.outputs.run == 'true'
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Run the stress ladder
        if: steps.scope.outputs.run == 'true'
        env:
          GODOT: /tmp/godot/Godot_v4.7-stable_linux.x86_64
          STRESS_MAX: ${{ github.event.inputs.stress_max || '64' }}
          STRESS_PROFILES: ${{ github.event.inputs.stress_profiles || 'lan' }}
        run: |
          # Every pattern up to STRESS_MAX bots. Budgets are a report; the driver exits non-zero on a hard
          # failure (a crash, a host or watcher frame over 2 s, a bot dropped by the host without a reason,
          # a peer record left after churn) and, since Phase 163, when a pattern's largest passing size drops
          # below the baseline's (`StressRules.BASELINE_LARGEST`, docs/perf/crowd-baseline.md).
          tools/stress.sh

      - name: The report names a largest passing size per pattern and the top hot spots
        if: always() && steps.scope.outputs.run == 'true'   # a hard failure still gets its report in the job summary
        env:
          STRESS_PROFILES: ${{ github.event.inputs.stress_profiles || 'lan' }}
        run: |
          test -s stress/report.json && test -s stress/report.md
          cat stress/report.md >> "$GITHUB_STEP_SUMMARY"
          want=$(( $(echo "$STRESS_PROFILES" | wc -w) * 5 ))
          got=$(grep -c '^STRESS_LARGEST ' stress/report.log || true)
          if [ "$got" -ne "$want" ]; then
            echo "::error::the report names a largest passing size for $got series, expected $want"
            exit 1
          fi
          if [ "$(grep -c '^STRESS_HOTSPOT ' stress/report.log || true)" -lt 3 ]; then
            echo "::error::the report names fewer than three hot spots"
            exit 1
          fi

      - name: Upload the stress report and run logs
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stress
          path: stress/
          if-no-files-found: warn

  playtest:
    name: Playtest bot (rendered session under xvfb)
    # A manual dispatch is for the crowd stress run only.
    if: github.event_name != 'workflow_dispatch'
    needs: native-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the Linux native builder
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: native/bin

      - name: Install a software renderer and X server
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers \
            libxcursor1 libxinerama1 libxi6 libxrandr2 libxkbcommon0 libasound2t64 libfontconfig1

      - name: Download Godot 4.7
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Run the playtest bot
        run: |
          # `--playtest-bot` is a USER arg (after `--`). The bot plays the listen host with
          # rendering, writes playtest/report.{json,md} and one PNG per step, and exits
          # non-zero on a hard failure (step timeout, any frame over 2 s). Slow percentiles
          # are a report, not a gate. A crash writes no report.json, which fails the check below.
          set +e
          # Phase 174: two extra report-only runs. The gate is the median of the three runs' p95
          # process time (tools/check_playtest_budget.py), so one noisy shared-runner run does not fail a PR.
          mkdir -p /tmp/pt-extra
          for n in 1 2; do
            rm -f playtest/report.json   # a crashed run must not hand its predecessor's report to the median
            timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" \
              /tmp/godot/Godot_v4.7-stable_linux.x86_64 --path . --rendering-driver opengl3 -- --playtest-bot --playtest-no-budget \
              > /tmp/pt-extra/run$n.log 2>&1
            cp playtest/report.json /tmp/pt-extra/report$n.json
          done
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.7-stable_linux.x86_64 --path . --rendering-driver opengl3 -- --playtest-bot --playtest-no-budget \
            2>&1 | tee /tmp/playtest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ ! -f playtest/report.json ]; then
            echo "::error::the bot wrote no report (crash or boot failure)"
            exit 1
          fi
          cat playtest/report.md >> "$GITHUB_STEP_SUMMARY"
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/playtest.log; then
            echo "::error::script/parse/compile errors present"
            exit 1
          fi
          for step in create walk stream flight mine gather craft character_sheet place fight travel horizon; do
            if [ ! -s "playtest/$step.png" ]; then
              echo "::error::missing screenshot for step $step"
              exit 1
            fi
          done
          cp playtest/report.json /tmp/pt-extra/report3.json
          # Phase 189: the gate also compares the flight step's collision and contents ms per attached chunk
          # with the record flight flown in the same run with the near ring off; prove that check first.
          python3 tools/check_playtest_budget.py --self-test || exit 1
          python3 tools/check_playtest_budget.py /tmp/pt-extra/report?.json || exit 1
          exit "$status"

      - name: Run the bot again on the GDScript fallback (Phase 169)
        run: |
          # Same commit, `--no-native`: the stream step's chunk build rate with the native builder
          # must be at least double this run's, and the native run must not hitch more than this one.
          # `--playtest-no-budget`: the Phase 174 process-time budget is the native builder's, gated above.
          mkdir -p /tmp/playtest-native
          cp playtest/report.json /tmp/playtest-native/report.json
          mkdir -p /tmp/playtest-native-png
          cp playtest/*.png /tmp/playtest-native-png/
          set +e
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.7-stable_linux.x86_64 --path . --rendering-driver opengl3 -- --playtest-bot --no-native --playtest-no-budget \
            2>&1 | tee /tmp/playtest-gdscript.log
          fallback_status=${PIPESTATUS[0]}
          set -e
          if [ ! -f playtest/report.json ]; then
            echo "::error::the fallback run wrote no report"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/playtest-gdscript.log; then
            echo "::error::script/parse/compile errors in the fallback run"
            exit 1
          fi
          if [ "$fallback_status" -ne 0 ]; then
            echo "::error::the fallback run failed (exit $fallback_status)"
            exit 1
          fi
          cp playtest/report.json /tmp/playtest-native/report-gdscript.json
          cp /tmp/playtest-native/report.json playtest/report.json
          cp /tmp/playtest-native-png/*.png playtest/   # keep the native run's screenshots with its report
          cp /tmp/playtest-native/report-gdscript.json playtest/report-gdscript.json
          python3 tools/check_stream_rate.py playtest/report.json playtest/report-gdscript.json | tee -a "$GITHUB_STEP_SUMMARY"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Fly the slow-machine case, worker pool limited to 2 threads (Phase 191)
        run: |
          # A machine with two worker threads must still keep the ground under a body flying at the old
          # 90 m/s (`/speed 10`). `override.cfg` beside project.godot limits the engine's worker pool; the bot
          # plays only the flight step (`--playtest-only flight`) at that speed. The step's own verdict is the
          # >= 90% coverage rule, so a non-zero exit or a missing `ok` fails the job.
          mkdir -p /tmp/playtest-main
          cp playtest/report.json /tmp/playtest-main/report.json
          rm -f playtest/report.json   # a slow run that writes nothing must not be judged on the main run's report
          printf '[threading]\nworker_pool/max_threads=2\n' > override.cfg
          set +e
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.7-stable_linux.x86_64 --path . --rendering-driver opengl3 -- --playtest-bot --playtest-no-budget \
            --playtest-only flight --playtest-flight-speed 10 2>&1 | tee /tmp/playtest-slow.log
          slow_status=${PIPESTATUS[0]}
          set -e
          rm -f override.cfg
          # Phase 194 (#512): the main run's report goes back before any check below can fail, so the upload
          # always carries it; the slow run's own report is kept beside it.
          rm -f /tmp/playtest-slow.json
          if [ -f playtest/report.json ]; then cp playtest/report.json /tmp/playtest-slow.json; fi
          cp /tmp/playtest-main/report.json playtest/report.json
          if [ -f /tmp/playtest-slow.json ]; then cp /tmp/playtest-slow.json playtest/report-slow.json; fi
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/playtest-slow.log; then
            echo "::error::script/parse/compile errors in the slow-machine run"
            exit 1
          fi
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          r = json.load(open("/tmp/playtest-slow.json"))
          f = [s for s in r["steps"] if s["step"] == "flight"]
          if not f or "flight" not in f[0]:
              print("::error::the slow-machine run recorded no flight step"); sys.exit(1)
          fl = f[0]["flight"]
          print("Slow machine (2 worker threads): %.0f m/s, ground under the body built in %.0f%% of %d samples (floor 90%%)" % (
              fl["speed_mps"], 100 * fl["under_cover"], fl["samples"]))
          if abs(fl["speed_mps"] - 90.0) > 0.5:
              print("::error::the slow-machine flight did not fly at 90 m/s"); sys.exit(1)
          if fl.get("gated") and fl["under_cover"] < 0.9:
              print("::error::the slow machine lost the ground under the body"); sys.exit(1)
          PY
          test "${PIPESTATUS[0]}" -eq 0
          test "$slow_status" -eq 0

      - name: Upload the playtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest
          path: playtest/
          if-no-files-found: warn

  export-check:
    name: Linux export (pull request)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No submodule: the export carries the committed placeholders only.

      - name: Download Godot 4.7 and its export templates
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          curl -fsSL -o /tmp/godot/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -o /tmp/godot/templates.tpz -d /tmp/godot/templates
          cp -r /tmp/godot/templates/templates/* ~/.local/share/godot/export_templates/4.7.stable/

      - name: Export the Linux preset
        # No binaries: the project is exported without the extension, which is how the
        # GDScript fallback ships (see native/README.md).
        run: |
          rm -f native/nihon_native.gdextension native/nihon_native.gdextension.uid
          mkdir -p build/linux
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --import || true
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release "Linux" build/linux/nihon.x86_64
          test -s build/linux/nihon.x86_64

      - name: The export without the native binaries boots on the GDScript fallback
        working-directory: build/linux
        run: |
          ./nihon.x86_64 --headless --quit-after 100000 -- --quit-after-boot 2>&1 | tee /tmp/export-fallback.log
          grep -q "\[Native\] chunk builder: gdscript fallback" /tmp/export-fallback.log
          grep -q "\[World\] first ring built" /tmp/export-fallback.log
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/export-fallback.log; then
            echo "::error::Script errors in the fallback export boot"
            exit 1
          fi

  export-native:
    name: Linux export with the native binaries (pull request)
    if: github.event_name == 'pull_request'
    needs: native-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: native/bin

      - name: Download Godot 4.7 and its export templates
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          curl -fsSL -o /tmp/godot/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -o /tmp/godot/templates.tpz -d /tmp/godot/templates
          cp -r /tmp/godot/templates/templates/* ~/.local/share/godot/export_templates/4.7.stable/

      - name: Export the Linux preset with the binaries and boot it
        run: |
          mkdir -p build/linux
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --import || true
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release "Linux" build/linux/nihon.x86_64
          cd build/linux
          ./nihon.x86_64 --headless --quit-after 100000 -- --quit-after-boot 2>&1 | tee /tmp/export-native.log
          grep -q "\[Native\] chunk builder: native" /tmp/export-native.log
          grep -q "\[World\] first ring built" /tmp/export-native.log

  build:
    name: Linux, Windows and macOS exports
    needs: [native-linux, native, native-suite, godot-tests, server-boot, host-boot, fabric, net-harness, playtest]
    # Pull requests export all three presets too (under a minute), so a preset only the main build used
    # (the macOS one, Phase 166) cannot break main on merge; only main uploads the builds.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No submodule: the builds carry the committed placeholders only.

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-binaries

      - name: Place the native binaries
        run: |
          mkdir -p native/bin
          cp native-binaries/*/* native/bin/

      - name: Download Godot 4.7 and its export templates
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          curl -fsSL -o /tmp/godot/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -o /tmp/godot/templates.tpz -d /tmp/godot/templates
          cp -r /tmp/godot/templates/templates/* ~/.local/share/godot/export_templates/4.7.stable/

      - name: Export the Linux, Windows and macOS presets
        env:
          # A pull request's native builders compile only template_debug (see `native`), so a PR checks
          # every preset with a debug export; main exports release.
          EXPORT_MODE: ${{ github.event_name == 'pull_request' && '--export-debug' || '--export-release' }}
        run: |
          mkdir -p build/linux build/windows build/macos
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --import || true
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . "$EXPORT_MODE" "Linux" build/linux/nihon.x86_64
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . "$EXPORT_MODE" "Windows Desktop" build/windows/nihon.exe
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . "$EXPORT_MODE" "macOS" build/macos/nihon.zip
          test -s build/linux/nihon.x86_64
          test -s build/windows/nihon.exe
          test -s build/macos/nihon.zip

      - name: Upload the Linux build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nihon-linux
          path: build/linux/

      - name: Upload the Windows build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nihon-windows
          path: build/windows/

      - name: Upload the macOS build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nihon-macos
          path: build/macos/
