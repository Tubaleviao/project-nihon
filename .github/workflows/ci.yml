name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  godot-tests:
    name: Godot headless test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The private `assets-prod` submodule is intentionally NOT checked out:
        # the public repo runs clean on the committed placeholders, and the
        # production art lives in a separately-built, gitignored .pck.

      - name: Download Godot 4.7
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Run headless test suite
        run: |
          # --quit is mandatory: without it the headless main loop never exits.
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --quit \
            2>&1 | tee /tmp/godot-tests.log
          if ! grep -q "All tests passed" /tmp/godot-tests.log; then
            echo "::error::test suite did not report 'All tests passed'"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-tests.log; then
            echo "::error::script/parse/compile errors present"
            exit 1
          fi
          if grep -q "✗" /tmp/godot-tests.log; then
            echo "::error::one or more tests failed"
            exit 1
          fi

  server-boot:
    name: Dedicated server boots clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Same submodule note as godot-tests: the public repo runs on the
        # committed placeholders.

      - name: Download Godot 4.7
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Boot the dedicated server headless
        run: |
          # `--server` is a USER arg: it must follow the `--` separator.
          # OS.get_cmdline_user_args() returns only what comes after it, so
          # passing `--server` among the engine args would silently boot a
          # listen host instead and the job would prove nothing.
          # `--quit` is mandatory: without it the headless main loop never exits.
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --quit -- --server \
            2>&1 | tee /tmp/godot-server.log
          # Positive assertion: the server path must report it actually came up,
          # not merely fail to crash.
          if ! grep -q "\[Server\] listening on port" /tmp/godot-server.log; then
            echo "::error::server did not report a listening line"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-server.log; then
            echo "::error::script/parse/compile errors present in the server boot log"
            exit 1
          fi

  host-boot:
    name: Listen host reaches the world (first ring placed)
    runs-on: ubuntu-latest
    # Phase 42 review pass 4 — a hard cap on this job. The boot below waits on
    # WorkerThreadPool tasks, and `--quit-after 100000` (its outer net) is FRAMES: a boot
    # that never reaches its tail would burn runner time up to GitHub's 360-minute default
    # before anyone learned the ring never opened. The measured boot is ~50 s, so ten
    # minutes is a wide margin that still fails fast.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        # Same submodule note as godot-tests: the public repo runs on the
        # committed placeholders.

      - name: Download Godot 4.7
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Boot the LISTEN HOST and assert its world boot completed
        run: |
          # Phase 42 moved the host tail (player spawn, boot demos, slot save) onto
          # `_process`, behind the first-ring gate, so it no longer runs inside
          # `_ready()`. `--quit` runs exactly ONE frame and therefore SKIPPED that
          # whole tail — which is why nothing here asserted the host boot any more.
          # `--quit-after N` runs real frames and reaches it.
          #
          # Phase 42 review #2 — but N counts FRAMES while the boot waits on WORKER
          # time, so a fast headless frame loop could burn the budget before the ring's
          # tasks land and this job would fail for a boot that was working. The boot
          # now ends ITSELF the moment its tail has run (`--quit-after-boot`), and
          # `--quit-after` is demoted to an outer net that only catches a boot which
          # never gets there — hence the very large count.
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --quit-after 100000 -- --quit-after-boot \
            2>&1 | tee /tmp/godot-host.log
          # Positive assertion: the tail RAN — the first ring was built and the player
          # was placed. That is the claim `--quit` used to cover by accident.
          if ! grep -q "\[World\] first ring built" /tmp/godot-host.log; then
            echo "::error::the host boot never reached its tail (first ring placed)"
            exit 1
          fi
          # And it must not have got there by TIMING OUT: the timeout warning names an
          # incomplete ring, which is a slow boot that says so, not a working one.
          if grep -q "first ring still incomplete" /tmp/godot-host.log; then
            echo "::error::the host boot only completed through the first-ring timeout"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-host.log; then
            echo "::error::script/parse/compile errors present in the host boot log"
            exit 1
          fi

  fabric:
    name: Fabric validation + drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate fabric schema
        run: npm run validate

      - name: Check generated files for fabric drift
        run: npm run check-drift

  net-harness:
    name: Two-client network harness (loopback ENet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Same submodule note as godot-tests: the public repo runs on the
        # committed placeholders.

      - name: Download Godot 4.7
        run: |
          mkdir -p /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64

      - name: Run the two-client harness
        env:
          # The driver takes the binary from $GODOT (it is not on PATH) and writes both
          # processes' logs under $NET_HARNESS_LOGDIR so the artifact step below can
          # collect them when a step fails.
          GODOT: /tmp/godot/Godot_v4.7-stable_linux.x86_64
          NET_HARNESS_LOGDIR: ${{ runner.temp }}/net-harness
        run: tools/net_harness.sh

      - name: Upload harness logs
        # Diagnostics only: the driver has already failed the job by this point, and the
        # two processes' logs are what says WHICH step broke.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: net-harness-logs
          path: ${{ runner.temp }}/net-harness
          if-no-files-found: ignore
